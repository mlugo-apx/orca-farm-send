<style>
  body { margin: 0; padding: 10px 12px 16px; font-size: 13px; line-height: 1.35;
         --fs-line: var(--orca-border); --fs-card: transparent; --fs-soft: var(--orca-muted);
         --fs-ok: #2a9d55; --fs-warn: #c77700; --fs-err: #d0392b; --fs-info: #5a9bec; }
  /* Outline, card fill and secondary text are mixed from the theme's text color, so they follow light and dark. */
  @supports (color: color-mix(in srgb, red 50%, blue)) {
    body { --fs-line: color-mix(in srgb, var(--orca-fg) 26%, transparent); --fs-card: color-mix(in srgb, var(--orca-fg) 5%, transparent);
           --fs-soft: color-mix(in srgb, var(--orca-fg) 72%, transparent);
           /* Status TEXT is mixed toward the text colour: lighter on a dark theme, darker on a light one,
              so small coloured text stays readable. Borders, bars and dots keep the pure colours. */
           --fs-ok: color-mix(in srgb, #2a9d55 62%, var(--orca-fg)); --fs-warn: color-mix(in srgb, #c77700 62%, var(--orca-fg));
           --fs-err: color-mix(in srgb, #d0392b 58%, var(--orca-fg)); --fs-info: color-mix(in srgb, #2f7de1 62%, var(--orca-fg)); }
  }
  .soft { color: var(--fs-soft); }
  .tiny { font-size: 11px; }
  h3 { margin: 0; font-size: 14px; }
  .row { display: flex; align-items: center; gap: 6px; }
  .spread { justify-content: space-between; }
  .muted { color: var(--orca-muted); }
  .small { font-size: 12px; }
  /* Buttons. Primary = a plain <button> (OrcaSlicer's accent fill): at most one per card or dialog.
     quiet = secondary, outlined. ghost = in-panel actions that used to be text links: no border until
     hovered. Every button is at least 24 px tall (WCAG 2.2 target size). Status pills below look
     different on purpose (tinted, no border), so a label is never mistaken for a button. */
  button { cursor: pointer; border: 1px solid var(--fs-line); border-radius: 6px; min-height: 24px; }
  button.quiet { background: var(--fs-card); color: var(--orca-fg); border: 1px solid var(--fs-line); }
  button.mini, button.sm { padding: 1px 8px; font-size: 12px; flex: none; }
  button.ghost { background: none; border-color: transparent; color: var(--fs-soft); padding: 1px 8px; font-size: 12px; flex: none; white-space: nowrap; }
  button.ghost:hover:not(:disabled) { background: var(--fs-line); color: var(--orca-fg); }
  button.danger { background: #c0392b; border-color: #c0392b; color: #fff; }
  button.danger-q { background: none; border-color: #d0392b; color: var(--fs-err); }
  button.warnbtn { background: none; border-color: #c77700; color: var(--fs-warn); padding: 0 8px; font-size: 11px; min-height: 20px; font-weight: normal; }
  button:disabled { opacity: .45; cursor: default; }
  button:focus-visible, .icon:focus-visible, [role=button]:focus-visible, summary:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--orca-accent); outline-offset: 1px; }
  /* Tabs: a neutral segmented switch, so the accent colour only ever means "the main action". */
  .seg { display: inline-flex; border: 1px solid var(--fs-line); border-radius: 6px; padding: 1px; gap: 1px; flex: none; }
  .seg button { min-height: 22px; border: 0; border-radius: 5px; background: none; color: var(--fs-soft); padding: 1px 7px; font-size: 12px; white-space: nowrap; }
  .seg button[aria-selected=true] { background: var(--fs-line); color: var(--orca-fg); }
  .menu { position: absolute; right: 0; top: 100%; margin-top: 4px; z-index: 5; background: var(--orca-bg); border: 1px solid var(--fs-line);
          border-radius: 6px; padding: 3px; display: none; min-width: 170px; box-shadow: 0 4px 14px rgba(0,0,0,.35); }
  .menu.show { display: block; }
  .menu button { display: block; width: 100%; text-align: left; background: none; border-color: transparent; color: var(--orca-fg); padding: 3px 8px; }
  .menu button:hover { background: var(--fs-line); }
  .box { border: 1px solid var(--fs-line); background: var(--fs-card); border-radius: 6px; padding: 8px 10px; margin-top: 8px; }
  .card { border-left: 3px solid #999; }
  .card.st-idle { border-left-color: #2a9d55; } .card.st-printing { border-left-color: #2f7de1; }
  .card.st-paused, .card.st-attention, .card.st-busy { border-left-color: #c77700; } .card.st-error { border-left-color: #d0392b; }
  .store-table { width: 100%; border-collapse: collapse; margin-top: 6px; table-layout: auto; }
  .store-table th { font-weight: normal; color: var(--fs-soft); text-align: left; padding: 0 0 3px 8px; border-bottom: 1px solid var(--fs-line); white-space: nowrap; }
  .store-table td { padding: 3px 0 0 8px; white-space: nowrap; }
  .store-table th:first-child, .store-table td:first-child { padding-left: 0; }
  .store-table .num { text-align: right; font-variant-numeric: tabular-nums; }
  /* Status pills: a tinted fill and no border, so they never look like buttons. */
  .pill { font-size: 11px; padding: 1px 8px; border-radius: 999px; border: 0; color: var(--fs-soft); white-space: nowrap; font-weight: 600;
          background: var(--fs-line); }
  @supports (color: color-mix(in srgb, red 50%, blue)) { .pill { background: color-mix(in srgb, currentColor 16%, transparent); } }
  .pill.st-idle { color: var(--fs-ok); } .pill.st-printing { color: var(--fs-info); }
  .pill.st-paused, .pill.st-attention, .pill.st-busy { color: var(--fs-warn); } .pill.st-error { color: var(--fs-err); }
  .chip { display: inline-block; border: 1px solid var(--fs-line); border-radius: 4px; padding: 0 5px; margin: 3px 4px 0 0; white-space: nowrap; }
  .facts { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 2px 10px; margin-top: 2px; }
  .job-name { font-weight: 600; word-break: break-all; }
  .warn { color: var(--fs-warn); }
  .err { color: var(--fs-err); }
  .ok { color: var(--fs-ok); }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #999; flex: none; }
  .dot.idle { background: #2a9d55; } .dot.printing { background: #2f7de1; } .dot.paused { background: #c77700; }
  .dot.error { background: #d0392b; } .dot.offline { background: #888; } .dot.busy { background: #c77700; }
  .card-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar { height: 5px; background: var(--fs-line); border-radius: 3px; overflow: hidden; margin: 5px 0 3px; }
  .bar.thin { height: 3px; margin: 5px 0 0; }
  .bar > i { display: block; height: 100%; background: var(--orca-accent); width: 0; }
  .actions { display: flex; gap: 6px; margin-top: 7px; flex-wrap: wrap; }
  .file { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .group { margin: 14px 0 0; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--fs-soft); display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .group::after { content: ''; flex: 1; height: 1px; background: var(--fs-line); }
  .group + .box { margin-top: 5px; }
  .slim { padding: 6px 10px; cursor: pointer; }
  .type + .type { margin-top: 9px; padding-top: 9px; border-top: 1px solid var(--orca-border); }
  .icon { background: none; border: none; padding: 0; margin: 0; line-height: 0; color: var(--orca-muted); border-radius: 4px; flex: none;
          width: 24px; height: 24px; min-height: 24px; display: inline-grid; place-items: center; }
  .icon:hover { color: var(--orca-fg); background: var(--orca-border); }
  .icon svg { width: 16px; height: 16px; display: block; pointer-events: none; }
  .chev svg { width: 14px; height: 14px; display: block; pointer-events: none; }
  .chev { color: var(--orca-muted); line-height: 0; flex: none; }
  .linkish { background: none; border: none; padding: 0 2px; color: var(--orca-muted); font-size: 12px; text-decoration: underline; }
  label.field { display: block; margin-top: 8px; font-size: 12px; }
  label.field input, label.field select { display: block; width: 100%; box-sizing: border-box; margin-top: 3px; }
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: flex-start; justify-content: center; padding-top: 30px; }
  #overlay.show { display: flex; }
  #dialog { background: var(--orca-bg); color: var(--orca-fg); border: 1px solid var(--orca-border); border-radius: 8px;
            padding: 14px; width: calc(100% - 44px); max-width: 360px; max-height: calc(100% - 60px); overflow: auto; }
  #dialog h4 { margin: 0 0 8px; font-size: 14px; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 6px; margin-top: 14px; flex-wrap: wrap; }
  .check { display: flex; gap: 6px; align-items: center; margin-top: 4px; }
  .check input { margin: 0; }
  ul.plain { margin: 6px 0 0; padding-left: 18px; }
  /* Facts as label / value rows. Values wrap instead of being cut off at the panel edge. */
  .kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 1px 8px; margin-top: 3px; font-size: 12px; }
  .kv > .k { color: var(--fs-soft); white-space: nowrap; }
  .kv > .v { min-width: 0; overflow-wrap: anywhere; }
  .name { font-weight: 600; overflow-wrap: anywhere; }
  /* A file or part name on a printer card: one line, cut with "..."; the full name shows on hover. */
  .clip { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .noteline { display: flex; gap: 0; min-width: 0; }
  .noteline > .when { flex: none; white-space: nowrap; }
  details.old > summary { cursor: pointer; color: var(--orca-muted); font-size: 12px; }
</style>

<div class="row spread">
  <h3 class="row" style="white-space:nowrap;gap:6px;min-width:0">Farm Send <span id="version" class="tiny muted" style="font-weight:normal" title="The Farm Send version this window is running"></span><button type="button" id="newer" class="warnbtn" style="display:none"></button></h3>
  <div class="row" style="gap:2px;position:relative;flex:none">
    <button type="button" class="icon" id="btn-refresh" title="Refresh: ask every printer for its status now" aria-label="Refresh every printer"></button>
    <button type="button" class="icon" id="btn-addmenu" title="Add printers" aria-label="Add printers" aria-haspopup="true" aria-expanded="false"></button>
    <button type="button" class="icon" id="btn-settings" title="Settings: open at start, debug log" aria-label="Settings" style="font-size:18px;line-height:1">&#9881;</button>
    <div class="menu" id="add-menu" role="menu">
      <button type="button" role="menuitem" id="btn-import" title="Add printers from your OrcaSlicer printer presets">Import from presets</button>
      <button type="button" role="menuitem" id="btn-add" title="Add a printer by its address">Add by address</button>
    </div>
  </div>
</div>

<div class="box" id="job"></div>
<div id="multi" class="box" style="display:none"></div>
<div id="printers"></div>
<div class="box" id="storage" style="display:none;margin-top:14px"></div>
<p id="empty" class="muted" style="display:none">No printers yet. Use Import to pull them from your printer presets, or Add.</p>

<div class="row spread small muted" style="margin-top:14px"><button type="button" id="debug-on" class="warnbtn" style="display:none" title="The debug log is recording. Click for Settings."></button><span></span>
  <span class="row" style="gap:12px"><button type="button" class="linkish" id="btn-runs" title="Every print this panel started, and how it ended">Print history</button>
  <button type="button" class="linkish" id="btn-report" title="Report a problem or request an enhancement: details to paste into a GitHub issue">Report a problem</button></span></div>

<div id="overlay"><div id="dialog"></div></div>

<script>
(function () {
  var state = { printers: [], jobs: [], job_for: {}, status: {}, sends: {}, slicing: false,
                combos: [], types: [], current: null, combo_note: { text: "" }, can_switch: false,
                library: [], folders: [], orders: [], order_plates: {}, toolhead_names: ["", "", "", ""], storage: {}, cleanup: { mode: "age", days: 30, keep: 50, auto: false, text: "" },
                video_cleanup: { mode: "age", days: 30, keep: 50, auto: false, text: "" } };
  var selected = {};
  var expanded = {};   // busy printers shown as a full card instead of one line
  var collapsed = {};  // available and needs-attention printers folded to one line
  var groupShut = {};  // printer groups folded to their heading
  var detailsOpen = {}; // printers whose card shows temperatures, rolls and the time of the last check
  var $ = function (id) { return document.getElementById(id); };

  function esc(value) {
    var span = document.createElement("span");
    span.textContent = value == null ? "" : String(value);
    // Also safe inside quoted attributes: names and file names come from presets and printers.
    return span.innerHTML.replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  // A file or part name that may wrap: it breaks after an underscore before it breaks inside a word.
  function nameHtml(value) { return esc(value).replace(/_/g, "_<wbr>"); }
  function duration(seconds) {
    if (seconds == null) return "";
    seconds = Math.max(0, Math.round(seconds));
    var h = Math.floor(seconds / 3600), m = Math.floor((seconds % 3600) / 60);
    return h > 0 ? h + "h " + (m < 10 ? "0" : "") + m + "m" : m + "m";
  }
  function temp(value) {
    if (!value) return "";
    return Math.round(value.current) + (value.target ? "/" + Math.round(value.target) : "") + "°";
  }
  function swatch(color) {
    if (!/^#[0-9a-fA-F]{6}$/.test(color || "")) return "";
    return "<span style='display:inline-block;width:10px;height:10px;border-radius:2px;border:1px solid var(--orca-border);" +
           "vertical-align:-1px;margin-right:4px;background:" + color + "'></span>";
  }
  // Preset names end in the printer they are for ("PETG @Elegoo CC2 0.4 nozzle"); the printer is shown already.
  function presetShort(name) { return String(name || "").split(" @")[0].trim(); }
  function processOf(presets) { return presetShort(String(presets || "").split(" \u00b7 ")[0]); }
  // Label / value rows; rows with no value are left out. Values are HTML.
  function kv(rows) {
    var html = rows.filter(function (r) { return r && r[1]; }).map(function (r) {
      return "<span class='k'>" + esc(r[0]) + "</span><span class='v'>" + r[1] + "</span>";
    }).join("");
    return html ? "<div class='kv'>" + html + "</div>" : "";
  }
  // A Centauri Carbon 2 feeds from the rolls of its Canvas unit; other printers have toolheads.
  function slotWord(model) { return /centauri\s*carbon\s*2/i.test(model || "") ? "Roll" : "Toolhead"; }
  function filamentRows(job) {
    return (job.filaments || []).map(function (f) {
      return [slotWord(job.printer_model) + " " + f.slot, swatch(f.color) + esc(presetShort(f.preset || f.type || "")) +
              (f.grams != null ? " <span class='muted'>" + esc(f.grams) + " g</span>" : "")];
    });
  }
  function filamentLines(job) { return kv(filamentRows(job)); }
  // The part a printer is printing, from the file name a send gave it:
  // "Clip.stl_3_PETG_6h57m_20261125-161956.gcode" -> "Clip". Other names are shown as they are.
  function partName(file) {
    var name = String(file || "").split("/").pop().replace(/\.gcode(\.3mf)?$/i, "");
    var ours = name.replace(/_\d{8}-\d{6}$/, "");
    if (ours !== name) ours = ours.replace(/_[^_]+_(\d+h)?\d+m$/, "");
    ours = ours.replace(/\.(stl|3mf|step|stp|obj|amf)(_\d+)?$/i, "");
    return ours || name;
  }
  function colorGap(a, b) {
    if (!/^#[0-9a-fA-F]{6}$/.test(a || "") || !/^#[0-9a-fA-F]{6}$/.test(b || "")) return 0;
    var total = 0;
    for (var i = 1; i < 7; i += 2) total += Math.abs(parseInt(a.substr(i, 2), 16) - parseInt(b.substr(i, 2), 16));
    return total;
  }
  // What the printer says is loaded in the toolheads this plate uses, and whether it disagrees.
  function loadedNote(printer, job) {
    var status = state.status[printer.id] || {}, tools = status.tools || [], notes = [];
    if (!tools.length) return "";
    (job.filaments || []).forEach(function (f) {
      var tool = tools.filter(function (x) { return x.slot === f.slot; })[0];
      var word = slotWord(printer.model).toLowerCase();
      if (!tool) { notes.push("<span class='warn'>no " + word + " " + f.slot + "</span>"); return; }
      if (!tool.loaded) { notes.push("<span class='warn'>" + word + " " + f.slot + " reports no filament</span>"); return; }
      var differs = colorGap(tool.color, f.color) > 90 || (tool.type && f.type && tool.type.toUpperCase() !== f.type.toUpperCase());
      notes.push((differs ? "<span class='warn'>" : "<span class='muted'>") + word + " " + f.slot + " has " + swatch(tool.color) +
                 esc(tool.type || "?") + (differs ? ", plate wants " + swatch(f.color) + esc(f.type || "") : "") + "</span>");
    });
    return notes.length ? "<div class='small'>" + notes.join(", ") + "</div>" : "";
  }
  // ---- refresh and clock times --------------------------------------------------------------
  var refreshing = {};   // printer id -> true from a Refresh click until that printer answers
  function refresh(ids) {
    ids.forEach(function (id) { refreshing[id] = true; });
    renderPrinters();
    send("refresh", ids.length === 1 ? { id: ids[0] } : {});
    // A printer that never answers must not leave its card stuck on "Checking...".
    setTimeout(function () { ids.forEach(function (id) { delete refreshing[id]; }); renderPrinters(); }, 40000);
  }
  function clock(date, seconds) {
    var options = { hour: "numeric", minute: "2-digit" };
    if (seconds) options.second = "2-digit";
    return date.toLocaleTimeString([], options);
  }
  function finishAt(remaining) {
    var now = new Date(), end = new Date(now.getTime() + remaining * 1000);
    var days = Math.round((new Date(end.getFullYear(), end.getMonth(), end.getDate()) -
                           new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 86400000);
    var day = days === 0 ? "" : days === 1 ? " tomorrow" : " " + end.toLocaleDateString([], { weekday: "short" });
    return "done ~" + clock(end, false) + day;
  }

  // Icons are drawn here, not taken from a font, so they look the same on every system.
  var ICONS = {
    refresh: "<path d='M13 8a5 5 0 1 1-1.5-3.6'/><path d='M13 2.5v3h-3'/>",
    plus: "<path d='M8 3.5v9'/><path d='M3.5 8h9'/>",
    edit: "<path d='M2.5 13.5l.6-2.9 7.6-7.6 2.3 2.3-7.6 7.6z'/><path d='M9.4 4.3l2.3 2.3'/>",
    up: "<path d='M3.5 10l4.5-4.5 4.5 4.5'/>",
    down: "<path d='M3.5 6l4.5 4.5 4.5-4.5'/>",
    trash: "<path d='M3 4.5h10'/><path d='M6.5 4.5V3h3v1.5'/><path d='M4.5 4.5l.6 8.5h5.8l.6-8.5'/>"
  };
  function svg(name) {
    return "<svg viewBox='0 0 16 16' fill='none' stroke='currentColor' stroke-width='1.6' stroke-linecap='round' " +
           "stroke-linejoin='round' aria-hidden='true'>" + ICONS[name] + "</svg>";
  }
  // A small icon button. The hint doubles as the label for screen readers.
  function iconButton(name, attribute, id, hint) {
    return "<button type='button' class='icon' " + attribute + "='" + esc(id) + "' title='" + esc(hint) + "' aria-label='" + esc(hint) + "'>" +
           svg(name) + "</button>";
  }

  function send(command, extra) {
    var message = extra || {};
    message.command = command;
    orca.postMessage(message);
  }

  // ---- dialogs -----------------------------------------------------------------------------
  function showDialog(html) { $("dialog").innerHTML = html; $("overlay").className = "show"; }
  function hideDialog() { $("overlay").className = ""; $("dialog").innerHTML = ""; }
  // The "newer version installed" pill: a click shows how to load it.
  var newerInfo = null;
  function showNewer() {
    if (!newerInfo) return;
    showDialog("<h4>Farm Send " + esc(newerInfo.installed) + " is installed</h4>" +
      "<p class='small muted' style='margin:0'>This window still runs " + esc(newerInfo.running) + ". To load the new one:</p>" +
      "<ol class='small' style='margin:8px 0 0;padding-left:20px'><li>Menu &gt; Plugins</li><li>Refresh</li>" +
      "<li>Untick Farm Send, then tick it again</li><li>Run it with the arrow</li></ol>" +
      "<p class='small muted' style='margin:8px 0 0'>Plates sliced in this window are dropped by the reload; slice again afterwards.</p>" +
      "<div class='dialog-actions'><button type='button' class='quiet' id='dlg-cancel'>Close</button></div>");
    $("dlg-cancel").onclick = hideDialog;
  }
  $("overlay").addEventListener("click", function (event) { if (event.target === $("overlay")) hideDialog(); });

  function jobOf(printer) {
    var id = state.job_for[printer.id];
    if (!id) return null;
    return state.jobs.filter(function (j) { return j.id === id && j.ready; })[0] || null;
  }
  function blockReason(printer, start) {
    var job = jobOf(printer), status = state.status[printer.id];
    if (!job) {
      var ready = state.jobs.filter(function (j) { return j.ready; });
      if (ready.length) return "No plate sliced for " + printer.model + " yet";
      if (state.jobs.length && !state.jobs[0].error) return "Reading the sliced G-code";
      return "Slice a plate first";
    }
    if (state.sends[printer.id] && state.sends[printer.id].active) return "Send in progress";
    if (!status || status.state === "unknown") return "Checking printer";
    if (status.state === "offline") return "Printer is offline";
    if (start && status.state !== "idle") return "Printer is " + (status.state_text || status.state).toLowerCase();
    if (start && status.needs_clearing) return "Clear the bed, then click Bed cleared";
    return "";
  }

  function confirmSend(printers, start) {
    // Group the printers by the plate each one will receive: one plate per printer type.
    var groups = [], seen = {};
    printers.forEach(function (p) {
      var job = jobOf(p);
      if (!job) return;
      if (!(job.id in seen)) { seen[job.id] = groups.length; groups.push({ job: job, printers: [] }); }
      groups[seen[job.id]].printers.push(p);
    });
    // Warnings first, in one place, so they cannot be missed inside a plate box.
    var warnings = [];
    groups.forEach(function (g) {
      if (g.job.stale) warnings.push(esc(g.job.display_name) + ": the plate changed after this slice. Re-slice if the change matters.");
      if (g.job.post_process) warnings.push(esc(g.job.display_name) + ": post-processing scripts are not applied to this file.");
    });
    var grams = 0, total = printers.length;
    var body = (warnings.length ? "<div class='box small warn' style='margin-top:8px'>" + warnings.join("<br>") + "</div>" : "") +
      groups.map(function (g) {
        if (g.job.filament_g != null) grams += g.job.filament_g * g.printers.length;
        // The file size does not help decide anything here; the finish time gets a row of its own.
        var facts = String(g.job.summary || "").replace(/ \u00b7 [\d.]+ MB$/, "");
        var done = start && g.job.time_s ? finishAt(g.job.time_s).replace(/^done /, "") : "";
        return "<div class='box' style='margin-top:8px'><div class='name small clip' title='" + esc(g.job.display_name) + "'>" + esc(g.job.display_name) + "</div>" +
          kv([["Print", esc(facts)], ["Done", esc(done)], ["For", esc(g.job.printer_model)]]) +
          filamentLines(g.job) +
          "<div style='margin-top:4px'>" + g.printers.map(function (p) {
            // The address is on hover: the name is what the user knows the printer by.

          }).join("") + "</div>" +
          g.printers.map(function (p) {
            var note = loadedNote(p, g.job);
            // The printer's name in front only when several are listed.
            return note ? "<div class='small'>" + (total > 1 ? esc(p.name) + ": " : "") + note.replace(/^<div class='small'>|<\/div>$/g, "") + "</div>" : "";
          }).join("") +
          "</div>";
      }).join("") +
      (total > 1 ? "<div class='small soft' style='margin-top:6px'>" + total + " printer" + (total === 1 ? "" : "s") +
        (grams ? " \u00b7 " + (Math.round(grams * 10) / 10) + " g of filament" : "") + "</div>" : "");
    var options = "";
    if (start) {
      var anyU1 = printers.some(function (p) { return p.kind === "moonraker"; });
      options = "<div class='check' style='margin-top:8px'><input type='checkbox' id='opt-level' checked><label for='opt-level'>Bed leveling before print</label></div>" +
                (anyU1 ? "<div class='check'><input type='checkbox' id='opt-flow'><label for='opt-flow'>Flow calibration (Snapmaker)</label></div>" : "") +
                "<div class='check'><input type='checkbox' id='opt-lapse'><label for='opt-lapse'>Time-lapse</label></div>";
    }
    showDialog(
      "<h4>" + (start ? "Start printing?" : "Upload?") + "</h4>" +
      "<p style='margin:0'>" + (start ? "Each print starts immediately." : "Files are uploaded, not printed.") +
      (groups.length > 1 ? " Each printer gets the plate sliced for its type." : "") + "</p>" + body + options +
      (start ? "<p class='small muted'>Make sure each bed is clear.</p>" : "") +
      "<div class='dialog-actions'><button type='button' class='quiet' id='dlg-cancel'>Cancel</button>" +
      "<button type='button' id='dlg-ok'" + (start ? " class='danger'" : "") + ">" + (start ? "Start print" : "Upload") + "</button></div>");
    $("dlg-cancel").onclick = hideDialog;
    $("dlg-ok").onclick = function () {
      var options = { bed_leveling: $("opt-level") ? $("opt-level").checked : true,
                      flow_calibrate: $("opt-flow") ? $("opt-flow").checked : false,
                      timelapse: $("opt-lapse") ? $("opt-lapse").checked : false };
      send("send", { printer_ids: printers.map(function (p) { return p.id; }), start: start, options: options });
      // The send is on its way: unselect those printers so the next slice does not find them still picked.
      printers.forEach(function (p) { delete selected[p.id]; });
      hideDialog();
      render();
    };
  }

  // ---- rendering ---------------------------------------------------------------------------
  // Plates: one row per printer type, with the plate held for it or a way to slice one.
  function platesFor(type) {
    return state.jobs.filter(function (j) { return j.ready && j.key === type.key; })
                     .sort(function (a, b) { return a.plate - b.plate; });
  }
  // Sliced plates are shown one line each; a click on the line opens its details. The printer type
  // OrcaSlicer is set to is open, the others are folded to one line.
  var typeOpen = {}, plateOpen = {};
  function plateBrief(job) { return String(job.summary || "").split(" · ").slice(0, 2).join(" · "); }
  function plateTitle(job, many) { return many ? "Plate " + job.plate : job.display_name; }
  // OrcaSlicer's copy counter ("Basket (13)") says nothing about the plate, so it is left out of the suggestion.
  function suggestedName(job, many) { return String(job.display_name || "").replace(/\s*\(\d+\)\s*$/, "") + (many ? " - plate " + job.plate : ""); }
  function platesHtml(jobs) {
    var many = jobs.length > 1;
    return jobs.map(function (job) {
      var open = !!plateOpen[job.id];
      var pick = !many ? "" : "<input type='radio' style='margin:0;flex:none' data-choose-plate='" + esc(job.id) + "'" + (job.chosen ? " checked" : "") +
                              " title='" + (job.chosen ? "The printer cards send this plate" : "Send this plate from the printer cards") + "'>";
      var keep = job.stale ? "" : (job.saved_as
        ? "<span class='ok small' style='flex:none' title='In the library as " + esc(job.saved_as) + "'>saved</span>"
        : "<button type='button' class='quiet' style='flex:none;padding:1px 8px;font-size:12px' data-lib-save='" + esc(job.id) +
          "' title='Keep this plate so it can be sent again later without slicing'>Save</button>");
      return "<div style='margin-top:4px'><div class='row' style='gap:6px'>" + pick +
        "<button type='button' class='linkish' style='flex:1;min-width:0;text-align:left;text-decoration:none;color:inherit;padding:0' data-plate-toggle='" + esc(job.id) +
          "' title='" + esc(job.display_name) + "'><span class='name'>" + (open ? "▾ " : "▸ ") + nameHtml(plateTitle(job, many)) + "</span>" +
          "<span class='muted small' style='display:block;padding-left:14px'>" + esc(plateBrief(job)) + "</span></button>" +
        keep + "</div>" +
        (job.stale ? "<div class='warn small'>Plate changed since this slice. Slice again if this type should get the change.</div>" : "") +
        (open ? "<div style='padding-left:14px'>" + plateHtml(job, many) + "</div>" : "") + "</div>";
    }).join("");
  }
  function plateHtml(job, many) {
    return kv([many ? ["Part", nameHtml(job.display_name)] : null, ["Print", esc(job.summary)], ["Sliced", esc(job.sliced_at)]]
              .concat(filamentRows(job), [["Process", esc(processOf(job.presets))]])) +
      (job.post_process ? "<div class='warn small'>Post-processing scripts are not applied.</div>" : "");
  }
  // A short tag for a printer model, shown on library rows: "Snapmaker U1" -> U1, "Elegoo Centauri Carbon 2" -> CC2.
  function modelTag(model) {
    var words = String(model || "").replace(/\(.*?\)/g, " ").trim().split(/\s+/).filter(Boolean);
    if (words.length > 1) words = words.slice(1);
    var text = words.join(" ");
    if (text.length <= 8) return text;
    return words.map(function (w) { return /^\d/.test(w) ? w : w.charAt(0).toUpperCase(); }).join("");
  }

  // ---- library: plates kept for reprinting ---------------------------------------------------
  var plateView = "now", libQuery = "", libNote = null, libLastFolder = "";
  // Set to false to hide the Orders tab; nothing else depends on it.
  var ORDERS_ENABLED = true;
  function libraryListHtml() {
    var words = libQuery.toLowerCase().split(/\s+/).filter(Boolean);
    var entries = state.library.filter(function (e) {
      var text = (e.item + " " + e.printer_model + " x" + e.parts).toLowerCase();
      return words.every(function (w) { return text.indexOf(w) >= 0; });
    });
    if (!state.library.length) return "<div class='muted small' style='margin-top:6px'>Nothing kept yet. Slice a plate, then click \u201csave to library\u201d on its row.</div>";
    if (!entries.length) return "<div class='muted small' style='margin-top:6px'>No item matches.</div>";
    var row = function (e) {
      // The model tag (CC2, U1) names the printer; its full name is in the tag's hover text.
      var saved = e.saved_at ? new Date(e.saved_at * 1000).toLocaleDateString([], { month: "short", day: "numeric" }) : "";
      return "<div class='type'><div class='row spread' style='gap:8px'>" +
        "<div class='row' style='gap:5px;min-width:0'>" +
          (modelTag(e.printer_model) ? "<span class='small' style='flex:none;border:1px solid var(--orca-border);border-radius:3px;padding:0 4px' title='" + esc(e.printer_model) + "'>" + esc(modelTag(e.printer_model)) + "</span>" : "") +
          "<div class='name' style='min-width:0'>" + nameHtml(e.item) + " <span class='muted' style='font-weight:400'>\u00d7" + esc(e.parts) + "</span></div></div>" +
        "<div class='row' style='flex:none'><button type='button' class='quiet' data-lib-send='" + esc(e.id) + "'" +
          (e.printers.length ? "" : " disabled") + ">Send</button>" + iconButton("edit", "data-lib-edit", e.id, "Rename, change the count or move to a folder") +
          iconButton("trash", "data-lib-del", e.id, "Remove from the library") + "</div></div>" +
        kv([["Print", esc(e.summary)]].concat(filamentRows(e), [["Process", esc(processOf(e.presets))], ["Kept", esc(saved)]])) +
        (e.printers.length ? "" : "<div class='warn small'>No printer of this type is set up.</div>") + "</div>";
    };
    // Grouped by folder; plates in no folder come first. A search opens every folder it finds something in.
    // A tree by folder path ("Clips / Vertical"). Plates in no folder come first, untitled.
    var by = {}, shown = {};
    entries.forEach(function (e) { var f = e.folder || ""; (by[f] = by[f] || []).push(e); });
    var paths = words.length ? [] : state.folders.slice();          // a search shows only folders with a match
    Object.keys(by).forEach(function (f) {
      var parts = f ? f.split(SEP) : [];
      for (var d = 1; d <= parts.length; d++) { var up = parts.slice(0, d).join(SEP); if (paths.indexOf(up) < 0) paths.push(up); }
    });
    if (!paths.length) return (by[""] || []).map(row).join("");
    var inside = function (f) { return entries.filter(function (e) { return e.folder === f || (e.folder || "").indexOf(f + SEP) === 0; }).length; };
    var kids = function (parent) {
      return paths.filter(function (f) { var cut = f.lastIndexOf(SEP); return (cut < 0 ? "" : f.slice(0, cut)) === parent; })
                  .sort(function (a, b) { return a.toLowerCase() < b.toLowerCase() ? -1 : 1; });
    };
    var node = function (f) {
      var open = words.length > 0 || !!libOpen[f], leaf = f.slice(f.lastIndexOf(SEP) < 0 ? 0 : f.lastIndexOf(SEP) + SEP.length);
      var depth = f.split(SEP).length, body = kids(f).map(node).join("") + (by[f] || []).map(row).join("");
      return "<div class='type'><div class='row spread' style='gap:6px'>" +
        "<button type='button' class='linkish file' style='padding:0;text-decoration:none;font-weight:600;color:inherit;text-align:left;min-width:0' data-lib-folder='" + esc(f) + "' title='" + esc(f) + "'>" +
        (open ? "\u25be " : "\u25b8 ") + esc(leaf) + " <span class='muted' style='font-weight:400;pointer-events:none'>(" + inside(f) + ")</span></button>" +
        "<div class='row' style='flex:none'>" + (depth < 4 ? iconButton("plus", "data-folder-new", f, "New folder inside this one") : "") +
          iconButton("edit", "data-folder-rename", f, "Rename this folder") +
          iconButton("trash", "data-folder-remove", f, "Remove this folder; what is in it is kept") + "</div></div>" +
        (open ? "<div style='margin:6px 0 0 9px'>" + (body || "<div class='muted small'>Empty. Move a plate here with its pencil, or pick this folder when you save one.</div>") + "</div>" : "") + "</div>";
    };
    return (by[""] || []).map(row).join("") + kids("").map(node).join("");
  }
  var SEP = " / ";
  function libraryTools() {
    var link = function (attr, label, title) {
      return "<button type='button' class='ghost' " + attr + (title ? " title='" + title + "'" : "") + ">" + label + "</button>";
    };
    return "<div class='row spread' style='margin-top:7px'><button type='button' class='quiet' style='white-space:nowrap' data-folder-new=''>New folder</button>" +
      link("data-tool-names='1'", "Toolhead names", "Name what each toolhead position holds, e.g. Black") + "</div>" +
      (state.folders.length ? "<div class='row' style='margin-top:3px;justify-content:flex-end'>" +
        (Object.keys(libOpen).some(function (f) { return libOpen[f]; })
          ? link("data-folders-all='closed'", "Collapse all folders") : link("data-folders-all='open'", "Expand all folders")) + "</div>" : "");
  }
  // old: full path of the folder to rename, or "" for a new one made inside parent ("" = top level).
  function folderDialog(old, parent) {
    var cut = old.lastIndexOf(SEP), home = old ? (cut < 0 ? "" : old.slice(0, cut)) : (parent || "");
    showDialog("<h4>" + (old ? "Rename folder" : "New folder") + "</h4>" +
      (home ? "<p class='small muted' style='margin:0'>Inside " + esc(home) + "</p>" : "") +
      "<label class='field'>Folder name<input id='f-name' maxlength='40' value='" + esc(old ? old.slice(cut < 0 ? 0 : cut + SEP.length) : "") + "'></label>" +
      "<p class='small' id='l-result' style='min-height:16px;margin:8px 0 0'></p>" +
      "<div class='dialog-actions'><button type='button' class='quiet' id='dlg-cancel'>Cancel</button><button type='button' id='dlg-ok'>" + (old ? "Rename" : "Create") + "</button></div>");
    $("dlg-cancel").onclick = hideDialog;
    $("dlg-ok").onclick = function () {
      var leaf = $("f-name").value.replace(/\//g, " ").trim();        // "/" separates levels, so not inside a name
      if (!leaf) { $("f-name").focus(); return; }

      send("library_folder", old ? { action: "rename", name: old, new: full } : { action: "add", name: full });
    };
    $("f-name").focus();
  }
  var libOpen = {};        // folders start collapsed; this holds the ones opened by hand
  function openFolderPath(f) {
    var parts = f ? f.split(SEP) : [];
    for (var d = 1; d <= parts.length; d++) libOpen[parts.slice(0, d).join(SEP)] = true;
  }
  // The folder picked in a dialog: the one selected, or a new one typed in, made inside the selected one.
  function pickedFolder() {
    var base = $("l-folder").value, leaf = $("l-newfolder").value.replace(/\//g, " ").trim();
    if (!leaf) return base;
    return (base ? base + SEP : "") + leaf;
  }
  function folderField(current) {
    var names = state.folders.slice();
    if (current && names.indexOf(current) < 0) names.push(current);
    return "<label class='field'>Folder<select id='l-folder'><option value=''>No folder</option>" + names.map(function (n) {
      return "<option value='" + esc(n) + "'" + (n === current ? " selected" : "") + ">" + esc(n) + "</option>"; }).join("") + "</select></label>" +
      "<label class='field'>Or a new folder<input id='l-newfolder' maxlength='40' placeholder='name, made inside the folder picked above'></label>";

  function wireFolderPicks() {}
  function editLibrary(id) {
    var e = state.library.filter(function (x) { return x.id === id; })[0];
    if (!e) return;
    showDialog("<h4>Edit library plate</h4>" +
      "<label class='field'>Item name<input id='l-item' value='" + esc(e.item) + "'></label>" +

      "<p class='small muted' style='margin:8px 0 0'>An open order finds its plates by item name, so renaming an item detaches it from that order.</p>" +
      "<p class='small' id='l-result' style='min-height:16px;margin:8px 0 0'></p>" +
      "<div class='dialog-actions'><button type='button' class='quiet' id='dlg-cancel'>Cancel</button><button type='button' id='dlg-ok'>Save</button></div>");

  // ---- orders: a quantity of one item, worked off plate by plate -------------------------------
  function toolLabel(n) { var name = state.toolhead_names[n - 1]; return n + (name ? " \u2014 " + name : ""); }
  function ordersHtml() {
    var html = "<div class='row spread' style='margin-top:7px'><button type='button' class='quiet' data-order-new='1'" +
      (state.library.length ? "" : " disabled") + ">New order</button>" +
      "<button type='button' class='linkish' data-tool-names='1' title='Name what each toolhead position holds, e.g. Black'>toolhead names</button></div>";
    if (!state.library.length) return html + "<div class='muted small' style='margin-top:6px'>Orders print plates from the library. Save a plate there first.</div>";

      return "<div class='type'><div class='row spread' style='gap:8px'>" +

        "<div class='row' style='flex:none'><button type='button' class='quiet' data-order-plan='" + esc(o.id) + "'" +

        "<div class='small " + (done ? "ok" : "muted") + "'>" + esc(bits.join(" \u00b7 ")) + "</div>" +
        ((o.toolhead || o.note) ? "<div class='small muted file'>" + esc((o.toolhead ? "Toolhead " + toolLabel(o.toolhead) : "") + (o.toolhead && o.note ? " \u00b7 " : "") + o.note) + "</div>" : "") +

  function newOrder() {

    showDialog("<h4>New order</h4>" +
      "<label class='field'>Item<select id='o-item'>" + items.map(function (i) { return "<option>" + esc(i) + "</option>"; }).join("") + "</select></label>" +
      "<label class='field'>Quantity wanted<input id='o-qty' type='number' min='1' max='99999'></label>" +

      return "<div class='type'><div class='row spread' style='gap:8px'>" + title + "<div class='row' style='flex:none'>" + action + "</div></div>" + body +
        "<div class='row spread small muted' style='gap:8px;margin-top:4px'><span style='min-width:0;overflow-wrap:anywhere'>" +
          (type.printers.length ? esc(type.printers.join(", ")) : "no printers of this type") + "</span><span class='row' style='flex:none;gap:2px'>" +
          (job && open ? "<button type='button' class='ghost' data-type-clear='" + esc(type.key) + "' title='Drop these sliced plates. Library plates are kept.'>Clear</button>" : "") +
          "<button type='button' class='ghost' data-type-presets='" + esc(type.key) + "' title='The printer, process and filament presets remembered for this type'>Edit presets</button></span></div></div>";
    }).join("") + "</div>";
    if (note.text) html += "<div class='small " + (note.ok ? "muted" : "err") + "' style='margin-top:6px'>" + esc(note.text) + "</div>";
    $("job").innerHTML = html;
  }

  // The presets remembered for one printer type: view, remember the current ones, forget.
  function presetsDialog(key) {
    var type = state.types.filter(function (t) { return t.key === key; })[0];
    if (!type) return;
    var combo = type.combo, current = state.current;
    var saved = combo
      ? "<div class='small'>Printer: " + esc(combo.printer) + "</div><div class='small'>Process: " + esc(combo.process) + "</div>" +
        "<div class='small'>Filament: " + esc(combo.filaments.join(", ") || "none") + "</div>"
      : "<div class='small muted'>Nothing remembered yet for this type.</div>";
    var canSave = type.selected && current && current.printer;
    showDialog("<h4>Presets for " + esc(type.label) + "</h4>" +
      "<p class='small muted' style='margin:0 0 6px'>Use presets switches OrcaSlicer to these in one click, so every slice for this type uses the same settings.</p>" +
      saved +
      "<p class='small muted' style='margin:10px 0 0'>" + (canSave
        ? "Selected in OrcaSlicer now: " + esc(current.printer) + " \u00b7 " + esc(current.process || "") + " \u00b7 " + esc((current.filaments || []).join(", "))
        : "To change them, select this printer type and the presets you want in OrcaSlicer first.") + "</p>" +
      "<div class='dialog-actions'>" +
        (combo ? "<button type='button' class='quiet' id='dlg-forget' style='margin-right:auto'>Forget</button>" : "") +
        "<button type='button' class='quiet' id='dlg-cancel'>Close</button>" +
        "<button type='button' id='dlg-ok'" + (canSave ? "" : " disabled") + ">Remember current</button></div>");
    $("dlg-cancel").onclick = hideDialog;
    $("dlg-ok").onclick = function () { send("save_combo"); hideDialog(); };
    if (combo) $("dlg-forget").onclick = function () { send("delete_combo", { key: key }); hideDialog(); };
  }

  $("job").addEventListener("click", function (event) {
    // The click may land on text inside a button: take the nearest element that carries an action.
    var node = event.target;
    while (node && node !== this && !Object.keys(node.dataset || {}).length) node = node.parentNode;
    var d = (node && node !== this && node.dataset) || {};
    if (d.view) { plateView = d.view; libNote = null; renderJob(); }
    else if (d.orderNew) newOrder();
    else if (d.toolNames) toolheadNames();
    else if (d.orderPlan) send("order_plan", { id: d.orderPlan });
    else if (d.orderDel) {
      var gone = state.orders.filter(function (x) { return x.id === d.orderDel; })[0];
      showDialog("<h4>Remove the order for " + esc(gone ? gone.quantity + " " + gone.item : "this item") + "?</h4>" +
        "<p class='small muted'>Its count is forgotten. Prints already running are not stopped.</p>" +
        "<div class='dialog-actions'><button type='button' class='quiet' id='dlg-cancel'>Cancel</button><button type='button' class='danger' id='dlg-ok'>Remove</button></div>");
      $("dlg-cancel").onclick = hideDialog;
      $("dlg-ok").onclick = function () { send("order_delete", { id: d.orderDel }); hideDialog(); };
    }
    else if (d.choosePlate) send("choose_plate", { id: d.choosePlate });
    else if (d.plateToggle) { plateOpen[d.plateToggle] = !plateOpen[d.plateToggle]; renderJob(); }
    else if (d.typeToggle) {
      var isOpen = event.target.closest("[data-type-toggle]").textContent.charAt(0) === "\u25be";
      typeOpen[d.typeToggle] = !isOpen; renderJob();
    }
    else if (d.saveAll) saveAllDialog(d.saveAll);
    else if (d.typeClear) {
      var kept = state.types.filter(function (t) { return t.key === d.typeClear; })[0];
      showDialog("<h4>Clear the sliced plates for " + esc(kept ? kept.label : "this type") + "?</h4>" +
        "<p class='small muted'>They are dropped from this panel. Plates saved to the library are kept. To get them back, slice again.</p>" +
        "<div class='dialog-actions'><button type='button' class='quiet' id='dlg-cancel'>Cancel</button><button type='button' class='danger' id='dlg-ok'>Clear</button></div>");
      $("dlg-cancel").onclick = hideDialog;
      $("dlg-ok").onclick = function () { send("clear_slices", { key: d.typeClear }); hideDialog(); };
    }
    else if (d.libSave) saveToLibrary(d.libSave);
    else if (d.libEdit) editLibrary(d.libEdit);
    else if (d.folderNew !== undefined) folderDialog("", d.folderNew);
    else if (d.folderRename) folderDialog(d.folderRename);
    else if (d.foldersAll) {
      libOpen = {};
      if (d.foldersAll === "open") state.folders.forEach(function (f) { libOpen[f] = true; });
      renderJob();          // the one toggle button changes its label too
    }
    else if (d.folderRemove) {
      var held = state.library.filter(function (x) { return x.folder === d.folderRemove || (x.folder || "").indexOf(d.folderRemove + SEP) === 0; }).length;
      var subs = state.folders.filter(function (f) { return f.indexOf(d.folderRemove + SEP) === 0; }).length;
      showDialog("<h4>Remove the folder \u201c" + esc(d.folderRemove) + "\u201d?</h4>" +
        "<p class='small muted'>" + (held || subs ? "What is in it is kept and moves up one level: " + held + " plate" + (held === 1 ? "" : "s") +
          (subs ? " and " + subs + " folder" + (subs === 1 ? "" : "s") : "") + "." : "It is empty.") + " No G-code is deleted.</p>" +
        "<div class='dialog-actions'><button type='button' class='quiet' id='dlg-cancel'>Cancel</button><button type='button' class='danger' id='dlg-ok'>Remove folder</button></div>");
      $("dlg-cancel").onclick = hideDialog;
      $("dlg-ok").onclick = function () { send("library_folder", { action: "remove", name: d.folderRemove }); hideDialog(); };
    }
    else if (d.libFolder !== undefined) { libOpen[d.libFolder] = !libOpen[d.libFolder]; $("lib-list").innerHTML = libraryListHtml(); }
    else if (d.libSend) sendFromLibrary(d.libSend);
    else if (d.libDel) {
      var entry = state.library.filter(function (x) { return x.id === d.libDel; })[0];
      showDialog("<h4>Remove " + esc(entry ? entry.item + " x" + entry.parts : "this plate") + " from the library?</h4>" +
        "<p class='small muted'>The kept G-code is deleted from this computer. Files already on the printers stay.</p>" +
        "<div class='dialog-actions'><button type='button' class='quiet' id='dlg-cancel'>Cancel</button><button type='button' class='danger' id='dlg-ok'>Remove</button></div>");
      $("dlg-cancel").onclick = hideDialog;
      $("dlg-ok").onclick = function () { send("library_delete", { id: d.libDel }); hideDialog(); };
    }
    else if (d.comboLoad) send("load_combo", { key: d.comboLoad });
    else if (d.typePresets) presetsDialog(d.typePresets);
  });

  function renderMulti() {
    // "Available" here means it could start now: a plate for its type, idle, bed clear.
    var withPlate = state.printers.filter(function (p) { return jobOf(p) && !blockReason(p, true); });
    var chosen = state.printers.filter(function (p) { return selected[p.id]; });
    if (chosen.length < 2 && withPlate.length < 2) { $("multi").style.display = "none"; return; }
    $("multi").style.display = "block";
    var allPicked = withPlate.length > 0 && withPlate.every(function (p) { return selected[p.id]; });
    var html = "<div class='row spread'><span>" + (chosen.length ? chosen.length + " selected" : "Send to several printers") + "</span><span>" +
      (withPlate.length >= 2 && !allPicked ? "<button type='button' class='ghost' id='multi-all'>Select all available (" + withPlate.length + ")</button>" : "") +
      (chosen.length ? "<button type='button' class='ghost' id='multi-clear'>Unselect all</button>" : "") + "</span></div>";
    if (chosen.length >= 2) {
      var uploadBlocked = chosen.some(function (p) { return blockReason(p, false); });
      var startBlocked = chosen.some(function (p) { return blockReason(p, true); });
      html += "<div class='actions'><button type='button' class='quiet' id='multi-upload'" + (uploadBlocked ? " disabled" : "") + ">Upload to all</button>" +
        "<button type='button' id='multi-start'" + (startBlocked ? " disabled" : "") + ">Upload and print on all</button></div>";
      if (uploadBlocked) html += "<div class='muted small' style='margin-top:4px'>A selected printer has no plate sliced for its type, or is offline.</div>";
      else if (startBlocked) html += "<div class='muted small' style='margin-top:4px'>Print is available when every selected printer is idle with a clear bed.</div>";
    }
    $("multi").innerHTML = html;
    if ($("multi-all")) $("multi-all").onclick = function () { withPlate.forEach(function (p) { selected[p.id] = true; }); render(); };
    if ($("multi-clear")) $("multi-clear").onclick = function () { selected = {}; render(); };
    if ($("multi-upload")) $("multi-upload").onclick = function () { confirmSend(chosen, false); };
    if ($("multi-start")) $("multi-start").onclick = function () { confirmSend(chosen, true); };
  }

  // Which group a printer belongs in. Nothing is hidden: the groups only order the list.
  function groupOf(p) {
    var status = state.status[p.id];
    if (!status || status.state === "unknown") return "busy";
    if (status.state === "paused" || status.state === "error" || status.state === "offline") return "attention";
    if (status.state === "idle") return status.needs_clearing ? "attention" : "available";
    return "busy";
  }
  function progressText(status) {
    var pct = status.progress == null ? "" : Math.round(status.progress) + "%";
    if (status.remaining_s == null) return pct;
    return (pct ? pct + " \u00b7 " : "") + (status.state === "paused" ? duration(status.remaining_s) + " left" : finishAt(status.remaining_s));
  }
  function slimCard(p, status) {
    var slimPct = status.state === "printing" && status.progress != null ? Math.round(status.progress) : null;
    return "<div class='box slim card st-" + esc(status.needs_clearing ? "attention" : status.state) + "' data-expand='" + esc(p.id) + "' title='Show details'>" +
      "<div class='row spread' data-expand='" + esc(p.id) + "'><div class='row' style='min-width:0' data-expand='" + esc(p.id) + "'>" +
        "<span class='dot " + esc(status.needs_clearing ? "paused" : status.state) + "'></span><span class='card-title' data-expand='" + esc(p.id) + "'>" + esc(p.name) + "</span></div>" +
      "<div class='row' style='flex:none' data-expand='" + esc(p.id) + "'>" +
      "<span class='small soft' style='white-space:nowrap' data-expand='" + esc(p.id) + "'>" +
        esc(refreshing[p.id] ? "Checking..." : (status.state === "printing" ? progressText(status) || "Printing" :
            (status.needs_clearing ? endedText(status) + ": clear the bed" : (status.state_text || status.state)))) +
      "</span><span class='chev' data-expand='" + esc(p.id) + "'>" + svg("down") + "</span></div></div>" +
      (slimPct == null ? "" : "<div class='bar thin' data-expand='" + esc(p.id) + "'><i style='width:" + slimPct + "%'></i></div>") + "</div>";
  }
  function fullCard(p, status, group) {
    var sending = state.sends[p.id];
    var uploadWhy = blockReason(p, false), startWhy = blockReason(p, true);
    var lines = "";
    if (status.state === "printing" || status.state === "paused") {
      var pct = status.progress == null ? null : Math.round(status.progress);
      lines += "<div class='name small clip' title='" + esc(status.filename) + "'>" + esc(partName(status.filename)) + "</div>" +
               "<div class='bar'><i style='width:" + (pct || 0) + "%'></i></div>" +
               "<div class='facts small'><span>" + (pct == null ? "" : "<b>" + pct + "%</b>") +
               (status.remaining_s == null ? "" : "<span class='soft'> \u00b7 " + duration(status.remaining_s) + " left</span>") + "</span><span>" +
               (status.remaining_s == null ? "" : (status.state === "paused" ? "paused" : finishAt(status.remaining_s))) + "</span></div>";
    }
    var main = lines, temps = [];
    lines = "";
    if (status.nozzle) temps.push("Nozzle " + temp(status.nozzle));
    if (status.bed) temps.push("Bed " + temp(status.bed));
    var checked = status.checked_at ? "checked " + clock(new Date(status.checked_at * 1000), true) : "";
    if (temps.length || checked) lines += "<div class='facts small soft'><span>" + temps.join(" \u00b7 ") +
                                          "</span><span class='tiny muted' style='white-space:nowrap'>" + checked + "</span></div>";
    if ((status.tools || []).length) {   // what the printer reports as loaded: a CC2's rolls, a Snapmaker's toolheads
      var what = p.kind === "elegoo_cc2" ? "Roll " : "Toolhead ";
      lines += "<div class='small soft'>" + status.tools.map(function (t) {
        var label = state.toolhead_names[t.slot - 1];
        return "<span class='chip' title='" + what + t.slot + (label ? " (" + esc(label) + ")" : "") + "'>" + t.slot + " " +
               (t.loaded ? swatch(t.color) + esc(t.type || "") : "<span class='warn'>empty</span>") + "</span>"; }).join("") + "</div>";
    }
    var details = lines;
    lines = main + (detailsOpen[p.id] ? details : "");
    if (status.notice) lines += "<div class='small noteline " + (status.notice.level === "error" ? "err" : "ok") + "'" +
                                " title='" + esc(status.notice.text + (status.notice.file ? "\n" + status.notice.file : "")) + "'><span class='clip'>" + esc(status.notice.text) +
                                "</span><span class='when'>&nbsp;\u00b7 " + clock(new Date(status.notice.at * 1000), false) + "</span></div>";
    if (status.state === "offline" && status.detail) lines += "<div class='small muted'>" + esc(status.detail) + "</div>";
    var stored = state.storage[p.id];
    if (stored && stored.many) lines += "<div class='small warn'>" + stored.count + " stored files. Uploads to this printer can start failing: clean up below.</div>";
    if (status.needs_clearing) {
      lines += "<div class='row spread' style='margin-top:6px;gap:8px'><span class='warn small'>Take the finished print off the bed.</span>" +
               "<button type='button' style='flex:none' data-cleared='" + esc(p.id) + "'>Bed cleared</button></div>";
    }
    var sendLine = "";
    if (sending) {
      if (sending.active) {
        sendLine = "<div class='small'>" + esc(sending.text) + "</div><div class='bar'><i style='width:" + Math.round(sending.percent || 0) + "%'></i></div>" +
                   "<button type='button' class='quiet mini' data-cancel='" + esc(p.id) + "'>Cancel</button>";
      } else {
        sendLine = "<div class='small " + (sending.ok ? "ok" : "err") + "'" + (sending.file ? " title='" + esc(sending.file) + "'" : "") + ">" +
                   nameHtml(sending.text) + "</div>";
      }
    }
    var hint = "";
    if (!sending || !sending.active) {
      // A printing or paused printer says so in its pill; the greyed button needs no second line.
      var working = status.state === "printing" || status.state === "paused";
      if (uploadWhy) hint = uploadWhy; else if (startWhy && !working) hint = "Print: " + startWhy.charAt(0).toLowerCase() + startWhy.slice(1);
    }
    var stateText = refreshing[p.id] ? "Checking..." : (status.needs_clearing ? endedText(status) : (status.state_text || status.state));
    // An opened busy card closes the way it opened: click its name or state. A ticked card stays
    // open, because the tick box only exists on the full card.
    var fold = !selected[p.id] && !(sending && sending.active)
      ? " data-collapse='" + esc(p.id) + "' style='cursor:pointer' title='Collapse'" : "";
    var look = status.needs_clearing ? "attention" : status.state;
    return "<div class='box card st-" + esc(look) + "'>" +
      "<div class='row spread'><div class='row' style='min-width:0'>" +
        "<input type='checkbox' data-pick='" + esc(p.id) + "'" + (selected[p.id] ? " checked" : "") + " title='Select for sending to several printers'>" +
        "<span class='dot " + esc(status.needs_clearing ? "paused" : status.state) + "'" + fold + "></span>" +
        "<span class='card-title'" + fold + ">" + esc(p.name) + "</span>" +
        (p.kind === "elegoo_cc1" ? " <span class='tiny warn' title='Experimental support, never run on a real Centauri Carbon by the developer'>experimental</span>" : "") + "</div>" +
        // Idle and free needs no label: the Available group and the green edge already say so.
        "<div class='row' style='gap:2px'>" + (look === "idle" && !refreshing[p.id] ? "" : "<span class='pill st-" + esc(look) + "'" + fold + ">" + esc(stateText) + "</span>") +
        (fold ? iconButton("up", "data-collapse", p.id, "Collapse") : "") +
        iconButton("refresh", "data-refresh", p.id, "Refresh: ask this printer for its status now") +
        iconButton("edit", "data-edit", p.id, "Edit this printer") + "</div></div>" +
      lines + sendLine +
      // A printer that is printing and cannot take anything shows no dead buttons.
      // No plate for this printer (or it is busy and can take nothing): no dead buttons, just the reason.
      ((group === "busy" && uploadWhy && startWhy) || !jobOf(p) ? "" : "<div class='actions'>" +
        "<button type='button' class='quiet' data-upload='" + esc(p.id) + "'" + (uploadWhy ? " disabled" : "") + ">Upload</button>" +
        "<button type='button'" + (status.needs_clearing ? " class='quiet'" : "") + " data-start='" + esc(p.id) + "'" + (startWhy ? " disabled title='" + esc(startWhy) + "'" : "") + ">Upload and print</button></div>") +
      "<div class='row spread small muted' style='margin-top:4px;gap:8px'><span>" + (group === "busy" && uploadWhy && startWhy ? "" : esc(hint)) + "</span>" +
        (details ? "<button type='button' class='ghost' data-details='" + esc(p.id) + "' title='Temperatures, loaded filament and the time of the last check'>" +
                   (detailsOpen[p.id] ? "Hide details" : "Details") + "</button>" : "") + "</div>" +
      "</div>";
  }
  function renderPrinters() {
    $("empty").style.display = state.printers.length ? "none" : "block";
    var groups = { attention: [], available: [], busy: [] };
    state.printers.forEach(function (p) { groups[groupOf(p)].push(p); });
    var titles = { attention: "Needs attention", available: "Available", busy: "Busy" };
    $("printers").innerHTML = ["attention", "available", "busy"].map(function (name) {
      var list = groups[name];
      if (!list.length && (name === "attention" || !state.printers.length)) return "";
      var shut = !!groupShut[name], hidden = 0;
      var body = list.map(function (p) {
        var status = state.status[p.id] || { state: "unknown", state_text: "Checking..." };
        // A folded group still shows a printer that is selected or in the middle of a send.
        if (shut && !selected[p.id] && !(state.sends[p.id] && state.sends[p.id].active)) { hidden++; return ""; }
        // A busy printer is one line, unless opened, selected or in the middle of a send.
        // Any other printer is a full card, unless folded by hand.
        var slim = (name === "busy" ? !expanded[p.id] : !!collapsed[p.id]) && !selected[p.id] && !(state.sends[p.id] && state.sends[p.id].active);
        return slim ? slimCard(p, status) : fullCard(p, status, name);
      }).join("");
      return "<div class='group' data-group-toggle='" + name + "' style='cursor:pointer' title='Click to " + (shut ? "show" : "hide") + " these printers'>" +
             (shut ? "\u25b8 " : "\u25be ") + titles[name] + " (" + list.length + ")</div>" +
             (shut && hidden ? body : (body || "<div class='small muted' style='margin-top:5px'>" + (name === "available" ? "No printer is free right now." : "Nothing is printing.") + "</div>"));
    }).join("");
  }

  // ---- stored files and cleanup ----------------------------------------------------------
  function megabytes(bytes) {
    var mb = (bytes || 0) / 1048576;
    return mb >= 1024 ? (mb / 1024).toFixed(1) + " GB" : Math.round(mb) + " MB";
  }
  function ageText(seconds) {
    if (!seconds) return "";
    var days = Math.floor((Date.now() / 1000 - seconds) / 86400);
    return days < 1 ? "today" : days + " d";
  }
  // Why old files cannot be removed from this printer right now. Mirrors the check in the plugin.
  function cleanBlock(p) {
    var status = state.status[p.id];
    if (!status || status.state === "unknown" || status.state === "offline") return "not reachable";
    if (p.kind === "elegoo_cc2" && status.state !== "idle") return "busy, cleaned when idle";
    if (state.sends[p.id] && state.sends[p.id].active) return "busy with a send";
    return "";
  }
  var counting = 0;   // printers still to answer after a recount was asked for
  var storeView = "gcode";   // which stored files the box shows: "gcode" or "videos" (time-lapse recordings)
  function storeRule() { return storeView === "videos" ? state.video_cleanup : state.cleanup; }
  // The counts for the view shown: G-code files, or recordings (null when the printer keeps none to list).
  function storeOf(p) { var st = state.storage[p.id]; return storeView === "videos" ? (st && st.count != null ? st.videos : undefined) : st; }
  function storeWord(n) { return storeView === "videos" ? (n === 1 ? "recording" : "recordings") : (n === 1 ? "file" : "files"); }
  function recount() {
    counting = state.printers.filter(function (p) { return p.kind !== "elegoo_cc1"; }).length;
    renderStorage();
    send("check_storage");
    setTimeout(function () { counting = 0; renderStorage(); }, 30000);   // never stuck on "Counting..."
  }
  function renderStorage() {
    $("storage").style.display = state.printers.length ? "block" : "none";
    var removable = 0;
    var body = state.printers.map(function (p) {
      var st = storeOf(p), whole = state.storage[p.id];
      var cells;
      if (p.kind === "elegoo_cc1") cells = "<td colspan='4' class='muted' title='This first version only checks status, uploads and starts prints on a Centauri Carbon'>not on a Centauri Carbon yet</td>";
      else if (st === null) cells = "<td colspan='4' class='muted'>none to list</td>";
      else if (!st || st.count == null) cells = "<td colspan='4' class='muted'>" + esc(whole && whole.error ? whole.error : "counting...") + "</td>";
      else {
        removable += st.removable || 0;
        cells = "<td class='num" + (st.many ? " warn" : "") + "'" + (st.many ? " title='Uploads began failing on printers holding this many files'" : "") + ">" + st.count + "</td>" +
                "<td class='num'>" + megabytes(st.bytes) + "</td>" +
                "<td class='num'>" + (st.oldest ? ageText(st.oldest) : "\u2013") + "</td>" +
                "<td class='num" + (st.removable ? " warn" : " muted") + "'>" + (st.removable || "\u2013") + "</td>";
      }
      return "<tr><td class='file'>" + esc(p.name) + "</td>" + cells + "</tr>";

      showDialog("<h4>Import from printer presets</h4><p>" + esc(message.text) + "</p>" + (rows ? "<ul class='plain'>" + rows + "</ul>" : "") +
        "<div class='dialog-actions'><button type='button' id='dlg-ok'>OK</button></div>");
      $("dlg-ok").onclick = hideDialog;
    }
  });

  send("init");
  setInterval(function () { send("poll"); }, 4000);
})();
</script>
